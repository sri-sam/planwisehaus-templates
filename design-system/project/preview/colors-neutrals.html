<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Neutrals & Surfaces</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(4,1fr);">
    
<div class="swatch">
  <div class="swatch__chip" style="background:#EDEAE2;"></div>
  <div class="swatch__label">Background</div>
  <div class="swatch__hex">#EDEAE2</div>
  <div class="swatch__role">Sheet / page bg</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#F5F2EC;"></div>
  <div class="swatch__label">Sidebar</div>
  <div class="swatch__hex">#F5F2EC</div>
  <div class="swatch__role">Nav rail</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#FFFFFF;"></div>
  <div class="swatch__label">Data</div>
  <div class="swatch__hex">#FFFFFF</div>
  <div class="swatch__role">Cell fill</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#DDD9D0;"></div>
  <div class="swatch__label">Gray</div>
  <div class="swatch__hex">#DDD9D0</div>
  <div class="swatch__role">Borders, dividers</div>
</div>
  </div>
</div></body></html>
