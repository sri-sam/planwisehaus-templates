<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(4,1fr);">
    
<div class="swatch">
  <div class="swatch__chip" style="background:#2E7D52;"></div>
  <div class="swatch__label">Success</div>
  <div class="swatch__hex">#2E7D52</div>
  <div class="swatch__role">On-budget, surplus</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#C8E6C9;"></div>
  <div class="swatch__label">Success bg</div>
  <div class="swatch__hex">#C8E6C9</div>
  <div class="swatch__role">Paid status pill</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#FFF9C4;"></div>
  <div class="swatch__label">Warning</div>
  <div class="swatch__hex">#FFF9C4</div>
  <div class="swatch__role">85–100% utilisation</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#C0392B;"></div>
  <div class="swatch__label">Danger</div>
  <div class="swatch__hex">#C0392B</div>
  <div class="swatch__role">Over-budget, deficit</div>
</div>
  </div>
</div></body></html>
