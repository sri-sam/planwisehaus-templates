<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spreadsheet Surface Tints</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    
<div class="swatch">
  <div class="swatch__chip" style="background:#E0F0EE;"></div>
  <div class="swatch__label">Light Teal</div>
  <div class="swatch__hex">#E0F0EE</div>
  <div class="swatch__role">Zebra row, KPI fill, totals</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#F0FAF8;"></div>
  <div class="swatch__label">Light Teal 2</div>
  <div class="swatch__hex">#F0FAF8</div>
  <div class="swatch__role">Alt zebra row</div>
</div>
    
<div class="swatch">
  <div class="swatch__chip" style="background:#FFFDE8;"></div>
  <div class="swatch__label">Input</div>
  <div class="swatch__hex">#FFFDE8</div>
  <div class="swatch__role">User input cells</div>
</div>
  </div>
</div></body></html>
