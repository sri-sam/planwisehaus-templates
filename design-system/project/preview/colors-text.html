<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Text Foreground</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:var(--pwh-data);">
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px 24px;">
    <div style="font-size:24px;color:#1F3D3A;font-weight:600;">FG-1 — Primary text<br><span class="mono" style="font-size:11px;color:var(--pwh-fg-3);">#1F3D3A</span></div>
    <div style="font-size:24px;color:#4A4A4A;font-weight:500;">FG-2 — Body<br><span class="mono" style="font-size:11px;color:var(--pwh-fg-3);">#4A4A4A</span></div>
    <div style="font-size:18px;color:#777777;">FG-3 — Muted / subtitle<br><span class="mono" style="font-size:11px;color:var(--pwh-fg-3);">#777777</span></div>
    <div style="font-size:18px;color:#999999;">FG-4 — Nav section labels<br><span class="mono" style="font-size:11px;color:var(--pwh-fg-3);">#999999</span></div>
  </div>
</div></body></html>
