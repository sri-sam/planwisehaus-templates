<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="eyebrow">BUTTONS</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
    <button style="font-family:var(--pwh-font-body);font-size:14px;font-weight:700;padding:10px 22px;background:var(--pwh-primary);color:#fff;border:none;border-radius:4px;letter-spacing:0.04em;cursor:pointer;">DOWNLOAD TEMPLATE</button>
    <button style="font-family:var(--pwh-font-body);font-size:14px;font-weight:700;padding:10px 22px;background:transparent;color:var(--pwh-primary);border:1.5px solid var(--pwh-primary);border-radius:4px;letter-spacing:0.04em;cursor:pointer;">SEE PREVIEW</button>
    <button style="font-family:var(--pwh-font-body);font-size:14px;font-weight:700;padding:10px 22px;background:var(--pwh-accent);color:var(--pwh-primary);border:none;border-radius:4px;letter-spacing:0.04em;cursor:pointer;">★ FAVOURITE</button>
    <a href="#" style="font-family:var(--pwh-font-body);font-size:14px;font-weight:600;color:var(--pwh-secondary);text-decoration:underline;text-underline-offset:3px;">Learn more →</a>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px;">
    <span style="font-family:var(--pwh-font-mono);font-size:11px;color:var(--pwh-fg-3);">primary · secondary · accent · link</span>
  </div>
</div></body></html>
