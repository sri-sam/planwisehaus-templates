<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Conditional Formatting</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:var(--pwh-bg);padding:20px 24px;">
  <div class="eyebrow">CONDITIONAL FORMATTING — DATA BARS + TRAFFIC LIGHTS</div>
  <div style="background:#fff;font-family:var(--pwh-font-body);">
    
      <div style="display:grid;grid-template-columns:120px 1fr 60px;font-size:13px;border-bottom:1px solid var(--pwh-gray);background:#fff;">
        <div style="padding:8px 14px;color:var(--pwh-fg-1);font-weight:400;">Housing</div>
        <div style="padding:8px 14px;position:relative;">
          <div style="height:14px;background:#F2EFE7;border-radius:2px;overflow:hidden;"><div style="height:100%;width:62%;background:var(--pwh-secondary);"></div></div>
        </div>
        <div style="padding:8px 14px;text-align:right;font-family:var(--pwh-font-mono);color:var(--pwh-fg-1);font-weight:400;">62%</div>
      </div>
      <div style="display:grid;grid-template-columns:120px 1fr 60px;font-size:13px;border-bottom:1px solid var(--pwh-gray);background:#FFF9C4;">
        <div style="padding:8px 14px;color:var(--pwh-fg-1);font-weight:400;">Groceries</div>
        <div style="padding:8px 14px;position:relative;">
          <div style="height:14px;background:#F2EFE7;border-radius:2px;overflow:hidden;"><div style="height:100%;width:88%;background:#C9A845;"></div></div>
        </div>
        <div style="padding:8px 14px;text-align:right;font-family:var(--pwh-font-mono);color:var(--pwh-fg-1);font-weight:400;">88%</div>
      </div>
      <div style="display:grid;grid-template-columns:120px 1fr 60px;font-size:13px;border-bottom:1px solid var(--pwh-gray);background:#FFCDD2;">
        <div style="padding:8px 14px;color:#B71C1C;font-weight:700;">Dining</div>
        <div style="padding:8px 14px;position:relative;">
          <div style="height:14px;background:#F2EFE7;border-radius:2px;overflow:hidden;"><div style="height:100%;width:100%;background:var(--pwh-danger);"></div></div>
        </div>
        <div style="padding:8px 14px;text-align:right;font-family:var(--pwh-font-mono);color:#B71C1C;font-weight:700;">118%</div>
      </div>
      <div style="display:grid;grid-template-columns:120px 1fr 60px;font-size:13px;border-bottom:1px solid var(--pwh-gray);background:#fff;">
        <div style="padding:8px 14px;color:var(--pwh-fg-1);font-weight:400;">Transport</div>
        <div style="padding:8px 14px;position:relative;">
          <div style="height:14px;background:#F2EFE7;border-radius:2px;overflow:hidden;"><div style="height:100%;width:41%;background:var(--pwh-secondary);"></div></div>
        </div>
        <div style="padding:8px 14px;text-align:right;font-family:var(--pwh-font-mono);color:var(--pwh-fg-1);font-weight:400;">41%</div>
      </div>
  </div>
</div></body></html>
