<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bar Chart</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="padding:26px 28px;gap:14px;">
  <div class="eyebrow" style="font-size:12px;">CHART STYLE — INCOME VS EXPENSES (CLUSTERED BAR)</div>
  <div style="background:#fff;padding:20px 22px 14px;">
    <div style="display:flex;align-items:flex-end;gap:18px;height:180px;border-bottom:1.5px solid var(--pwh-gray);padding:0 4px;">
      <!-- 9 months -->
      <!-- index 0 J -->
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:60%;background:#2C5F5A;"></div>
          <div style="width:14px;height:40%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:64%;background:#2C5F5A;"></div>
          <div style="width:14px;height:47%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:68%;background:#2C5F5A;"></div>
          <div style="width:14px;height:54%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:72%;background:#2C5F5A;"></div>
          <div style="width:14px;height:58%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:78%;background:#2C5F5A;"></div>
          <div style="width:14px;height:51%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:82%;background:#2C5F5A;"></div>
          <div style="width:14px;height:62%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:86%;background:#2C5F5A;"></div>
          <div style="width:14px;height:66%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:90%;background:#2C5F5A;"></div>
          <div style="width:14px;height:70%;background:#C9A845;"></div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;">
        <div style="display:flex;align-items:flex-end;gap:3px;height:100%;">
          <div style="width:14px;height:94%;background:#2C5F5A;"></div>
          <div style="width:14px;height:74%;background:#C9A845;"></div>
        </div>
      </div>
    </div>
    <!-- X-axis month labels -->
    <div style="display:flex;gap:18px;padding:8px 4px 0;">
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Jan</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Feb</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Mar</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Apr</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">May</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Jun</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Jul</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Aug</div>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--pwh-fg-2);">Sep</div>
    </div>
    <!-- Legend -->
    <div style="display:flex;gap:24px;justify-content:center;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--pwh-gray);">
      <span style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--pwh-fg-1);"><span style="display:inline-block;width:14px;height:14px;background:#2C5F5A;border-radius:2px;"></span>Income</span>
      <span style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--pwh-fg-1);"><span style="display:inline-block;width:14px;height:14px;background:#C9A845;border-radius:2px;"></span>Expenses</span>
    </div>
  </div>
</div>
</body></html>
