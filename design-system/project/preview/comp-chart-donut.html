<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Donut Chart</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="padding:26px 28px;gap:16px;">
  <div class="eyebrow" style="font-size:12px;">CHART STYLE — DONUT (EXPENSE DISTRIBUTION)</div>
  <div style="display:flex;align-items:center;gap:36px;">
    <svg viewBox="0 0 120 120" style="width:240px;height:240px;flex-shrink:0;">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#2C5F5A" stroke-width="22" stroke-dasharray="78 276" stroke-dashoffset="0"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#3D8A85" stroke-width="22" stroke-dasharray="62 276" stroke-dashoffset="-78"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#C9A845" stroke-width="22" stroke-dasharray="48 276" stroke-dashoffset="-140"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#2E7D52" stroke-width="22" stroke-dasharray="40 276" stroke-dashoffset="-188"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#DDD9D0" stroke-width="22" stroke-dasharray="48 276" stroke-dashoffset="-228"/>
      <text x="60" y="57" text-anchor="middle" font-family="Carlito,Calibri,sans-serif" font-size="7" fill="#777" letter-spacing="1">TOTAL</text>
      <text x="60" y="70" text-anchor="middle" font-family="Carlito,Calibri,sans-serif" font-size="11" font-weight="700" fill="#2C5F5A">$3,840</text>
    </svg>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:16px;color:var(--pwh-fg-1);flex:1;">
      <div style="display:flex;align-items:center;gap:12px;"><span style="width:14px;height:14px;background:#2C5F5A;border-radius:2px;flex-shrink:0;"></span><span style="flex:1;font-weight:600;">Housing</span><span style="font-family:var(--pwh-font-mono);color:var(--pwh-fg-3);">28%</span></div>
      <div style="display:flex;align-items:center;gap:12px;"><span style="width:14px;height:14px;background:#3D8A85;border-radius:2px;flex-shrink:0;"></span><span style="flex:1;font-weight:600;">Groceries</span><span style="font-family:var(--pwh-font-mono);color:var(--pwh-fg-3);">23%</span></div>
      <div style="display:flex;align-items:center;gap:12px;"><span style="width:14px;height:14px;background:#C9A845;border-radius:2px;flex-shrink:0;"></span><span style="flex:1;font-weight:600;">Transport</span><span style="font-family:var(--pwh-font-mono);color:var(--pwh-fg-3);">18%</span></div>
      <div style="display:flex;align-items:center;gap:12px;"><span style="width:14px;height:14px;background:#2E7D52;border-radius:2px;flex-shrink:0;"></span><span style="flex:1;font-weight:600;">Dining</span><span style="font-family:var(--pwh-font-mono);color:var(--pwh-fg-3);">15%</span></div>
      <div style="display:flex;align-items:center;gap:12px;"><span style="width:14px;height:14px;background:#DDD9D0;border-radius:2px;flex-shrink:0;"></span><span style="flex:1;font-weight:600;">Other</span><span style="font-family:var(--pwh-font-mono);color:var(--pwh-fg-3);">16%</span></div>
    </div>
  </div>
</div>
</body></html>
