<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Data Table</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="background:var(--pwh-bg);padding:24px 26px;gap:14px;">
  <div class="eyebrow" style="font-size:12px;">DATA TABLE — ZEBRA + DATA BARS + TRAFFIC LIGHTS</div>
  <div style="background:#fff;font-family:var(--pwh-font-body);">
    <div style="display:grid;grid-template-columns:90px 1fr 100px 110px 100px;background:var(--pwh-lt-teal);border-bottom:2px solid var(--pwh-secondary);font-size:13px;font-weight:700;color:var(--pwh-primary);text-transform:uppercase;letter-spacing:0.06em;">
      <div style="padding:10px 14px;">Date</div>
      <div style="padding:10px 14px;">Category</div>
      <div style="padding:10px 14px;text-align:right;">Amount</div>
      <div style="padding:10px 14px;text-align:right;">% Budget</div>
      <div style="padding:10px 14px;text-align:center;">Status</div>
    </div>
    <!-- rows -->
    <div style="display:grid;grid-template-columns:90px 1fr 100px 110px 100px;font-size:14px;background:#F0FAF8;border-bottom:1px solid var(--pwh-gray);">
      <div style="padding:10px 14px;">Jan 03</div>
      <div style="padding:10px 14px;">Groceries</div>
      <div style="padding:10px 14px;text-align:right;font-family:var(--pwh-font-mono);">$148.20</div>
      <div style="padding:10px 14px;text-align:right;position:relative;font-family:var(--pwh-font-mono);">
        <div style="position:absolute;left:10px;right:10px;bottom:6px;height:5px;background:#E8E5DC;border-radius:2px;"><div style="height:100%;width:42%;background:var(--pwh-secondary);border-radius:2px;"></div></div>
        <span style="position:relative;">42%</span>
      </div>
      <div style="padding:10px 14px;text-align:center;"><span style="background:#C8E6C9;color:#2E7D52;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:0.06em;text-transform:uppercase;">Paid</span></div>
    </div>

    <div style="display:grid;grid-template-columns:90px 1fr 100px 110px 100px;font-size:14px;background:#fff;border-bottom:1px solid var(--pwh-gray);">
      <div style="padding:10px 14px;">Jan 04</div>
      <div style="padding:10px 14px;">Utilities</div>
      <div style="padding:10px 14px;text-align:right;font-family:var(--pwh-font-mono);">$210.00</div>
      <div style="padding:10px 14px;text-align:right;position:relative;font-family:var(--pwh-font-mono);">
        <div style="position:absolute;left:10px;right:10px;bottom:6px;height:5px;background:#E8E5DC;border-radius:2px;"><div style="height:100%;width:88%;background:var(--pwh-accent);border-radius:2px;"></div></div>
        <span style="position:relative;">88%</span>
      </div>
      <div style="padding:10px 14px;text-align:center;"><span style="background:#FFF9C4;color:#7A6A1B;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:0.06em;text-transform:uppercase;">Pending</span></div>
    </div>

    <div style="display:grid;grid-template-columns:90px 1fr 100px 110px 100px;font-size:14px;background:#FFE4E0;color:var(--pwh-danger);font-weight:700;border-bottom:1px solid var(--pwh-gray);">
      <div style="padding:10px 14px;">Jan 06</div>
      <div style="padding:10px 14px;">Dining</div>
      <div style="padding:10px 14px;text-align:right;font-family:var(--pwh-font-mono);">$67.40</div>
      <div style="padding:10px 14px;text-align:right;position:relative;font-family:var(--pwh-font-mono);">
        <div style="position:absolute;left:10px;right:10px;bottom:6px;height:5px;background:#F2D9D5;border-radius:2px;"><div style="height:100%;width:100%;background:var(--pwh-danger);border-radius:2px;"></div></div>
        <span style="position:relative;">110%</span>
      </div>
      <div style="padding:10px 14px;text-align:center;"><span style="background:#FFCDD2;color:#B71C1C;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:0.06em;text-transform:uppercase;">Overdue</span></div>
    </div>

    <div style="display:grid;grid-template-columns:90px 1fr 100px 110px 100px;font-size:14px;background:#fff;">
      <div style="padding:10px 14px;">Jan 08</div>
      <div style="padding:10px 14px;">Transport</div>
      <div style="padding:10px 14px;text-align:right;font-family:var(--pwh-font-mono);">$45.00</div>
      <div style="padding:10px 14px;text-align:right;position:relative;font-family:var(--pwh-font-mono);">
        <div style="position:absolute;left:10px;right:10px;bottom:6px;height:5px;background:#E8E5DC;border-radius:2px;"><div style="height:100%;width:30%;background:var(--pwh-secondary);border-radius:2px;"></div></div>
        <span style="position:relative;">30%</span>
      </div>
      <div style="padding:10px 14px;text-align:center;"><span style="background:#C8E6C9;color:#2E7D52;font-size:11px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:0.06em;text-transform:uppercase;">Paid</span></div>
    </div>
  </div>
</div>
</body></html>
