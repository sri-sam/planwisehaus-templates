<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Input Cell</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="eyebrow">INPUT CELLS — PALE YELLOW FILL + GOLD UNDERLINE</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--pwh-bg);padding:18px;">
    <label style="font-size:11px;color:var(--pwh-primary);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px;">Your Name
      <input style="background:var(--pwh-input);border:none;border-bottom:1.5px solid var(--pwh-accent);padding:8px 10px;font-family:var(--pwh-font-body);font-size:13px;color:var(--pwh-fg-1);" value="Sammy R."></label>
    <label style="font-size:11px;color:var(--pwh-primary);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px;">Year
      <input style="background:var(--pwh-input);border:none;border-bottom:1.5px solid var(--pwh-accent);padding:8px 10px;font-family:var(--pwh-font-mono);font-size:13px;color:var(--pwh-fg-1);" value="2025"></label>
    <label style="font-size:11px;color:var(--pwh-primary);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px;">Currency
      <select style="background:var(--pwh-input);border:none;border-bottom:1.5px solid var(--pwh-accent);padding:8px 10px;font-family:var(--pwh-font-body);font-size:13px;color:var(--pwh-fg-1);appearance:none;"><option>$ — USD</option></select></label>
    <label style="font-size:11px;color:var(--pwh-primary);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:flex;flex-direction:column;gap:6px;">Monthly Budget
      <input style="background:var(--pwh-input);border:none;border-bottom:1.5px solid var(--pwh-accent);padding:8px 10px;font-family:var(--pwh-font-mono);font-size:13px;color:var(--pwh-fg-1);" value="$4,200"></label>
  </div>
</div></body></html>
