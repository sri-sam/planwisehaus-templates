<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>KPI Card</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:var(--pwh-bg);">
  <div class="eyebrow">KPI CARDS — THE SIGNATURE DASHBOARD UNIT</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
    
      <div style="background:var(--pwh-lt-teal);border-radius:0;overflow:hidden;">
        <div style="height:5px;background:var(--pwh-accent);"></div>
        <div style="padding:10px 8px 4px;text-align:center;font-family:var(--pwh-font-body);font-size:24px;font-weight:700;color:var(--pwh-primary);">$78,400</div>
        <div style="padding:0 8px 12px;text-align:center;font-family:var(--pwh-font-body);font-size:8.5px;font-weight:700;color:#888;letter-spacing:0.1em;text-transform:uppercase;">ANNUAL INCOME</div>
      </div>
      <div style="background:var(--pwh-lt-teal);border-radius:0;overflow:hidden;">
        <div style="height:5px;background:var(--pwh-accent);"></div>
        <div style="padding:10px 8px 4px;text-align:center;font-family:var(--pwh-font-body);font-size:24px;font-weight:700;color:var(--pwh-success);">$12,840</div>
        <div style="padding:0 8px 12px;text-align:center;font-family:var(--pwh-font-body);font-size:8.5px;font-weight:700;color:#888;letter-spacing:0.1em;text-transform:uppercase;">NET SAVINGS</div>
      </div>
      <div style="background:var(--pwh-lt-teal);border-radius:0;overflow:hidden;">
        <div style="height:5px;background:var(--pwh-accent);"></div>
        <div style="padding:10px 8px 4px;text-align:center;font-family:var(--pwh-font-body);font-size:24px;font-weight:700;color:var(--pwh-primary);">16.4%</div>
        <div style="padding:0 8px 12px;text-align:center;font-family:var(--pwh-font-body);font-size:8.5px;font-weight:700;color:#888;letter-spacing:0.1em;text-transform:uppercase;">SAVINGS RATE</div>
      </div>
      <div style="background:var(--pwh-lt-teal);border-radius:0;overflow:hidden;">
        <div style="height:5px;background:var(--pwh-accent);"></div>
        <div style="padding:10px 8px 4px;text-align:center;font-family:var(--pwh-font-body);font-size:24px;font-weight:700;color:var(--pwh-danger);">-$5,210</div>
        <div style="padding:0 8px 12px;text-align:center;font-family:var(--pwh-font-body);font-size:8.5px;font-weight:700;color:#888;letter-spacing:0.1em;text-transform:uppercase;">TOTAL DEBT</div>
      </div>
  </div>
</div></body></html>
