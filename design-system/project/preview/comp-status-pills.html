<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Status Pills & Pickers</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="eyebrow">STATUS PILLS · DROPDOWNS · CHECKBOXES</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <span style="background:#C8E6C9;color:#2E7D52;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">Paid</span><span style="background:#FFF9C4;color:#7A6A1B;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">Pending</span><span style="background:#FFCDD2;color:#B71C1C;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">Overdue</span><span style="background:#C8E6C9;color:#2E7D52;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">On Track</span><span style="background:#FFCDD2;color:#B71C1C;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">Over Budget</span><span style="background:#E8E5DC;color:#5A5A5A;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">Not Started</span><span style="background:#E0F0EE;color:#2C5F5A;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">In Progress</span><span style="background:#C8E6C9;color:#2E7D52;font-size:11px;font-weight:700;padding:4px 12px;border-radius:2px;letter-spacing:0.06em;text-transform:uppercase;">Complete</span>
  </div>
  <div style="display:flex;gap:14px;align-items:center;margin-top:8px;">
    <div style="position:relative;display:inline-block;">
      <select style="appearance:none;background:var(--pwh-input);border:none;border-bottom:1.5px solid var(--pwh-accent);padding:7px 28px 7px 12px;font-family:var(--pwh-font-body);font-size:12px;color:var(--pwh-fg-1);"><option>Priority — High</option></select>
      <span style="position:absolute;right:10px;top:9px;font-size:9px;color:var(--pwh-fg-3);">▼</span>
    </div>
    <label style="font-size:13px;color:var(--pwh-fg-1);display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;background:var(--pwh-secondary);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;">✓</span> Hired</label>
    <label style="font-size:13px;color:var(--pwh-fg-3);display:flex;align-items:center;gap:8px;"><span style="width:14px;height:14px;border:1.5px solid var(--pwh-gray);background:#fff;border-radius:2px;"></span> Thank you sent</label>
  </div>
</div></body></html>
