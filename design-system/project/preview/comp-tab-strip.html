<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Tab Strip</title>
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card" style="padding:0;background:var(--pwh-bg);">
  <div style="height:6px;background:var(--pwh-accent);"></div>
  <div style="padding:24px 28px 22px;">
    <div class="eyebrow" style="font-size:12px;">EXCEL TAB STRIP — TEAL TAB COLOR, ACTIVE WHITE FACE</div>
    <div style="margin-top:18px;display:flex;align-items:flex-end;gap:3px;border-bottom:2px solid var(--pwh-primary);">
      <div style="background:#2C5F5A;color:#fff;padding:10px 18px;font-size:14px;font-weight:500;font-family:var(--pwh-font-body);border-top-left-radius:5px;border-top-right-radius:5px;">Instructions</div>
      <div style="background:#2C5F5A;color:#fff;padding:10px 18px;font-size:14px;font-weight:500;font-family:var(--pwh-font-body);border-top-left-radius:5px;border-top-right-radius:5px;">Setup</div>
      <div style="background:#fff;color:#2C5F5A;padding:10px 18px;font-size:14px;font-weight:700;font-family:var(--pwh-font-body);border-top-left-radius:5px;border-top-right-radius:5px;border:1px solid #2C5F5A;border-bottom:2px solid #fff;position:relative;top:2px;">Dashboard</div>
      <div style="background:#2C5F5A;color:#fff;padding:10px 18px;font-size:14px;font-weight:500;font-family:var(--pwh-font-body);border-top-left-radius:5px;border-top-right-radius:5px;">January</div>
      <div style="background:#2C5F5A;color:#fff;padding:10px 18px;font-size:14px;font-weight:500;font-family:var(--pwh-font-body);border-top-left-radius:5px;border-top-right-radius:5px;">February</div>
      <div style="background:#2C5F5A;color:#fff;padding:10px 18px;font-size:14px;font-weight:500;font-family:var(--pwh-font-body);border-top-left-radius:5px;border-top-right-radius:5px;">March</div>
    </div>
    <div style="font-size:13px;color:var(--pwh-fg-3);margin-top:16px;line-height:1.5;">
      Tab color set to <span style="font-family:var(--pwh-font-mono);color:var(--pwh-primary);font-weight:700;">#2C5F5A</span>. Active tab lifts 2 px above the strip; inactive sit flush.
    </div>
  </div>
</div>
</body></html>
